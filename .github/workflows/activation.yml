name: Request activation file
on: workflow_dispatch
jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Create activation file
        run: |
          docker run --rm -v "$PWD:/work" -w /work unityci/editor:ubuntu-2019.4.40f1-base-1.0.1 /opt/unity/Editor/Unity -quit -batchmode -nographics -logFile - -createManualActivationFile || true
          sudo chmod -R a+rw .
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: Manual Activation File
          path: "*.alf"
          if-no-files-found: error
